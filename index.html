        let startTime;
        let timerInterval;
        let studentName = "";

        function startQuiz() {
            studentName = document.getElementById("studentName").value.trim();
            if (!studentName) {
                alert("Vui lòng nhập tên của bạn!");
                return;
            }

            document.getElementById("login-screen").classList.add("hidden");
            document.getElementById("quiz-screen").classList.remove("hidden");
            document.getElementById("display-name").innerText = "Học sinh: " + studentName;

            renderQuestions();

            // Bắt đầu đếm giờ
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsedTime = Math.floor((Date.now() - startTime) / 1000);
                document.getElementById("timer").innerText = elapsedTime;
            }, 1000);
        }

        function renderQuestions() {
            const container = document.getElementById("questions-container");
            container.innerHTML = "";

            questions.forEach((q, index) => {
                let html = `<div class="bg-gray-50 p-4 rounded border"><p class="font-bold mb-2">${q.question}</p>`;
                
                if (q.type === "trac-nghiem") {
                    q.options.forEach(opt => {
                        html += `<label class="block mb-1"><input type="radio" name="q${index}" value="${opt}" class="mr-2"> ${opt}</label>`;
                    });
                } else if (q.type === "tra-loi-ngan") {
                    html += `<input type="text" id="q${index}" class="w-full p-2 border rounded" placeholder="Nhập đáp án...">`;
                } else if (q.type === "dung-sai") {
                    html += `<label class="block mb-1"><input type="radio" name="q${index}" value="Đúng" class="mr-2"> Đúng</label>`;
                    html += `<label class="block mb-1"><input type="radio" name="q${index}" value="Sai" class="mr-2"> Sai</label>`;
                }
                html += `</div>`;
                container.innerHTML += html;
            });
        }

        function submitQuiz() {
            clearInterval(timerInterval);
            const timeTaken = Math.floor((Date.now() - startTime) / 1000);
            let score = 0;

            // Chấm điểm cơ bản (Mỗi câu 10đ)
            questions.forEach((q, index) => {
                if (q.type === "trac-nghiem" || q.type === "dung-sai") {
                    const selected = document.querySelector(`input[name="q${index}"]:checked`);
                    if (selected && selected.value.trim() === q.correct) score += 10;
                } else if (q.type === "tra-loi-ngan") {
                    const answer = document.getElementById(`q${index}`).value.trim().toLowerCase();
                    if (answer === q.correct.toLowerCase()) score += 10;
                }
            });

            document.getElementById("quiz-screen").classList.add("hidden");
            document.getElementById("result-screen").classList.remove("hidden");
            
            document.getElementById("final-score").innerText = score;
            document.getElementById("final-time").innerText = timeTaken;

            // Gửi dữ liệu về Google Sheets
            sendDataToSheet(studentName, score, timeTaken);
        }

        function sendDataToSheet(name, score, time) {
            const payload = {
                action: "save_toan_pizza", // Kích hoạt Case 11
                hoTen: name,
                diem: score,
                thoiGian: time
            };

            fetch(GOOGLE_APP_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors", // Bỏ qua lỗi CORS khi gọi Web App
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(() => {
                document.getElementById("status-msg").innerText = "✅ Đã nộp bài thành công!";
                document.getElementById("status-msg").classList.replace("text-gray-600", "text-green-600");
            })
            .catch(error => {
                document.getElementById("status-msg").innerText = "❌ Lỗi mạng, hãy báo với thầy!";
                document.getElementById("status-msg").classList.replace("text-gray-600", "text-red-600");
            });
        }
    </script>
</body>
